baseURL = 'https://my-website-2ne.pages.dev/'
languageCode = 'ja-jp'
title = '北澤茉奈のホームページ'
theme = 'PaperMod'

hasCJKLanguage = true

[params]
  env = "production"
  defaultTheme = "light"
  disableThemeToggle = true
  paginate = 1
  dateFormat = "2006-1-2"
  
[[menu.main]]
  name = 'Home'
  url = '/'
  weight = 1

[[menu.main]]
  name = 'Information'
  url = '/information/'
  weight = 2

[[menu.main]]
  name = 'Profile'
  url = '/profile/'
  weight = 3

[[menu.main]]
  name = 'Day Log'
  url = '/day-log/'
  weight = 4

[[menu.main]]
  name = 'Keywords'
  url = '/keywords/'
  weight = 5

[[menu.main]]
  name = 'Book Log'
  url = '/book-log/'
  weight = 6

[[menu.main]]
  name = 'Search'
  url = '/search/'
  weight = 7

[markup.goldmark.renderer]
  unsafe = true

[params]
  # 昼夜モード切替ボタンをヘッダーに表示
  defaultTheme = "auto" # "light" や "dark" にも設定可能
  disableThemeToggle = false

# 検索機能用の出力フォーマット（JSON）を許可
[outputs]
  home = ["HTML", "RSS", "JSON"]
