{{- define "main" }}
{{- if .Title }}
<header class="page-header">
    <h1>{{ .Title }}</h1>
</header>
{{- end }}

<div class="post-content">
    {{- $terms := .Data.Terms.Alphabetical -}}
    
    <div id="keywords-container">
        <ul class="terms-tags">
            {{- range $terms }}
            <li data-name="{{ .Page.Title }}">
                <a href="{{ .Page.Permalink }}">{{ .Page.Title }} <sup><strong><sup>{{ .Count }}</sup></strong></sup></a>
            </li>
            {{- end }}
        </ul>
    </div>
</div>

<style>
.kana-group-title {
    font-size: 1.25rem;
    font-weight: bold;
    margin-top: 2rem;
    margin-bottom: 0.8rem;
    padding-bottom: 0.3rem;
    border-bottom: 2px solid var(--border);
    color: var(--primary);
}
.kana-group-list {
    list-style: none;
    padding-left: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}
.kana-group-list li a {
    display: inline-block;
    padding: 5px 12px;
    background: var(--code-bg);
    border-radius: 6px;
    text-decoration: none;
    font-size: 0.95rem;
}
</style>

<script>

    const container = document.getElementById("keywords-container");
    const items = Array.from(container.querySelectorAll("li[data-name]"));

    if (items.length === 0) return;

    // 漢字キーワードの読み（ひらがな）変換辞書
    const kanjiToKana = {
        "上からの変化": "うえからのへんか", "不確実性の回避": "ふかくじつせいのかいひ", "中動態": "ちゅうどうたい",
        "二言語使用": "にげんごしよう", "二重分節性": "にじゅうぶんせつせい", "互換性": "ごかんせい",
        "交感的コミュニケーション": "こうかんてきこみゅにけーしょん", "交感的言語使用": "こうかんてきげんごしよう",
        "交替潜時": "こうたいせんじ", "人称": "にんしょう", "人類学": "じんるいがく", "会話分析": "かいわぶんせき",

        "共笑": "きょうしょう", "共通基盤": "きょうつうきばん", "内容語": "ないようご", "内的制約条件": "ないてきせいやくじょうけん",
        "分節": "ぶんせつ", "初対面会話": "しょたいめんかいわ", "制度的談話": "せいどてきだんわ", "前提": "ぜんてい",
        "副詞": "ふくし", "助数詞": "じょすうし", "動機付け": "どうきづけ", "動物のコミュニケーション": "どうぶつのこみゅにけーしょん",
        "勧誘": "かんゆう", "千本ノック": "せんぼんのっく", "協調の原理": "きょうちょうのげんり", "参与の枠組み": "さんよのわくぐみ",
        "参照点能力": "さんしょうてんのうりょく", "反復練習": "はんぷくれんしゅう", "名付け": "なづけ", "名前": "なまえ",
        "含意": "がんい", "呪文": "じゅもん", "呼びかけ語": "よびかけご", "呼称": "こしょう", "命名権": "めいめいけん",
        "命題": "めいだい", "商標": "しょうひょう", "固有名詞学": "こゆうめいしがく", "国際共修": "こくさいきょうしゅう",
        "垣根表現": "かきねひょうげん", "変異": "へんい", "変異理論": "へんいりろん", "変種": "へんしゅ",
        "外来語": "がいらいご", "外的制約条件": "がいてきせいやくじょうけん", "外的要因": "がいてきよういん", "大字": "だいじ",
        "婉曲法": "えんきょくほう", "婉曲表現": "えんきょくひょうげん", "定型化": "ていけいか", "容認性": "ようにんせい",
        "容認発音": "ようにんはつおん", "対人的機能": "たいじんてききのう", "対照分析": "たいしょうぶんせき", "対称詞": "たいしょうし",
        "対話統語論": "たいわとうごろん", "対象化": "たいしょうか", "市民言語学": "しみんげんごがく", "広告": "こうこく",
        "役割語": "やくわりご", "心内語": "しんないご", "心理学": "しんりがく", "忌み言葉": "いみことば", "恣意性": "しいせい",
        "悪態": "あくたい", "意味": "いみ", "意味変化": "いみへんか", "意味論的含意": "いみろんてきがんい",
        "感情分析": "かんじょうぶんせき", "感謝": "かんしゃ", "慣用句": "かんようく", "慣習": "かんしゅう",
        "批判的談話分析": "ひはんてくだんわぶんせき", "投擲的発話": "とうてきてきはつわ", "投機": "とうき", "指標性": "しひょうせい",
        "捉え方": "とらえかた", "敬体": "けいたい", "敬語": "けいご", "文体論": "ぶんたいろん", "文化的伝達": "ぶんかてきでんたつ",
        "文字論": "もじろん", "文法マーカー": "ぶんぽうまーかー", "文法化": "ぶんぽうか", "新語": "しんご", "方言": "ほうげん",
        "方言コスプレ": "ほうげんこすぷれ", "方言区画論": "ほうげんくかくろん", "方言周圏論": "ほうげんしゅうけんろん",
        "有標・無標": "ゆうひょうむひょう", "有界性": "ゆうかいせい", "概念メタファー": "がいねんめたふぁー", "構文": "こうぶん",
        "構文文法": "こうぶんぶんぽう", "模倣": "もほう", "機能語": "きのうご", "歴史語用論": "れきしごようろん",
        "気配りの公理 （Tact Maxim）": "けくばりのこうり", "法言語学": "ほうげんごがく", "漂白": "ひょうはく",
        "無生物主語": "むせいぶつしゅご", "無界性": "むかいせい", "特殊化": "とくしゅか", "状況モデル": "じょうきょうもでる",
        "生成AI": "せいせいあい", "生成文法": "せいせいぶんぽう", "生産性": "せいさんせい", "異化": "いか",
        "異文化コミュニケーション": "いぶんかこみゅにけーしょん", "発話の共同構築": "はつわのきょうどうこうちく",
        "発話媒介行為": "はつわばいかいこうい", "発話行為": "はつわこうい", "発語内効力": "はつごないこうりょく",
        "百科事典的意味": "ひゃっかじてんてきいみ", "文包摂名詞"："ぶんほうせつめいし", "相互行為": "そうごこうい", "相互行為の社会言語学": "そうごこういのしゃかいげんごがく",
        "相同性": "そうどうせい", "相槌": "あいづち", "知覚": "ちかく", "社会化": "しゃかいか",
        "社会指標的機能": "しゃかいしひょうてききのう", "社会言語学": "しゃかいげんごがく", "社会語用論": "しゃかいごようろん",
        "移動動詞": "いどうどうし", "笑い": "わらい", "笑い表現": "わらいひょうげん", "簡略化された言語": "かんりゃく化されたげんご",
        "精密/制限コード": "せいみつせいげんこーど", "繰り返し": "くりかえし", "習慣的な思考": "しゅうかんてきなしこう", "翻訳": "ほんやく",
        "聞き手志向": "ききてしこう", "聞き手行動": "ききてこうどう", "職場談話": "しょくばだんわ", "自己開示": "じこかいじ",
        "自称詞": "じしょうし", "英語教育": "えいごきょういく", "褒め": "ほめ", "規範": "きはん", "視点": "してん",
        "視線": "しせん", "言いさし文": "いいさしぶん", "言及指示的機能": "げんきゅうしじてききのう", "言語の起源": "げんごのきげん",
        "言語人類学": "げんごじんるいがく", "言語変化": "げんごへんか", "言語景観": "げんごけいかん", "言語相対論": "げんごそうたいろん",
        "言語習得": "げんごしゅうとく", "記号": "きごう", "話し手志向": "はなしてしこう", "話し言葉": "はなしことば",
        "話題展開": "わだいてんかい", "認知意味論": "にんちいみろん", "認知言語学": "にんちげんごがく", "語り": "かたり",
        "語彙": "ごい", "語法効果": "ごほうこうか", "語用論": "ごようろん", "語用論標識": "ごようろんひょうしき", "説得": "せっとく",
        "説明スタイル": "せつめいすたいる", "談話分析": "だんわぶんせき", "談話標識": "だんわひょうしき", "謝罪": "しゃざい",
        "識別力": "しきべつりょく", "質的分析": "しつてきぶんせき", "身体感覚": "しんたいかんかく", "転位可能性": "てんいかのうせい",
        "辞書的意味": "じしょてきいみ", "通訳": "つうやく", "速記": "そっき", "連濁": "れんだく", "過剰矯正": "かじょうきょうせい",
        "選択体系機能言語学": "せんたくたいけいきのうげんごがく", "重言": "じゅうげん", "重訳": "じゅうやく", "量的分析": "りょうてきぶんせき",
        "間主観性": "かんしゅかんせい", "間接言語行為": "かんせつげんごこうい", "関連性理論": "かんれんせいりろん", "陣形": "じんけい",
        "隠語": "いんご", "隣接ペア": "りんせつぺあ", "雑談": "ざつだん", "音象徴": "おんしょうちょう", "響鳴": "きょうめい",
        "頭韻": "とういん", "類型": "るいけい", "高コンテクスト": "こうこんてくすと"
    };

    const isAlphabet = (str) => /^[a-zA-ZＡ-Ｚa-z]/.test(str);

    // 単語の「読み（キー）」を取得する関数
    const getSortKey = (name) => {
        if (kanjiToKana[name]) return kanjiToKana[name];
        return name;
    };

    // 1. あいうえお順にソート
    items.sort((a, b) => {
        const nameA = a.dataset.name;
        const nameB = b.dataset.name;
        const keyA = getSortKey(nameA);
        const keyB = getSortKey(nameB);

        if (isAlphabet(nameA) && isAlphabet(nameB)) {
            return nameA.localeCompare(nameB, 'en', { sensitivity: 'base' });
        }
        return keyA.localeCompare(keyB, 'ja');
    });

    // 五十音判定ルール
    const kanaRows = [
        { name: "あ行", re: /^[あ-おア-オアイウエオ]/ },
        { name: "か行", re: /^[か-ごカ-ゴ]/ },
        { name: "さ行", re: /^[さ-ぞサ-ゾ]/ },
        { name: "た行", re: /^[た-どタ-ド]/ },
        { name: "な行", re: /^[な-のナ-ノ]/ },
        { name: "は行", re: /^[は-ぼハ-ホパ-ポ]/ },
        { name: "ま行", re: /^[ま-もマ-モ]/ },
        { name: "や行", re: /^[や-よヤ-ヨ]/ },
        { name: "ら行", re: /^[ら-ろラ-ロ]/ },
        { name: "わ行", re: /^[わ-んワ-ン]/ }
    ];

    const groups = {};
    items.forEach(item => {
        const name = item.dataset.name;
        const key = getSortKey(name);
        let matchedRow = "その他";

        if (isAlphabet(name)) {
            matchedRow = "アルファベット（A-Z）";
        } else {
            for (const row of kanaRows) {
                if (row.re.test(key)) {
                    matchedRow = row.name;
                    break;
                }
            }
        }

        if (!groups[matchedRow]) groups[matchedRow] = [];
        groups[matchedRow].push(item);
    });

    container.innerHTML = "";

    const rowOrder = [
        "アルファベット（A-Z）",
        "あ行", "か行", "さ行", "た行", "な行", 
        "は行", "ま行", "や行", "ら行", "わ行", 
        "その他"
    ];

    rowOrder.forEach(rowName => {
        if (groups[rowName] && groups[rowName].length > 0) {
            const titleNode = document.createElement("div");
            titleNode.className = "kana-group-title";
            titleNode.textContent = rowName;
            container.appendChild(titleNode);

            const listNode = document.createElement("ul");
            listNode.className = "kana-group-list";
            groups[rowName].forEach(item => listNode.appendChild(item));
            container.appendChild(listNode);
        }
    });
});
</script>
{{- end }}
