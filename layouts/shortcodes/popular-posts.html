<div id="popular-posts-container">
  <p style="opacity: 0.8; font-size: 0.9em;">読み込み中...</p>
</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const posts = [
    {{ range where .Site.RegularPages "Section" "day-log" }}
    {
      title: {{ .Title }},
      url: {{ .RelPermalink }},
      date: {{ .Date.Format "2006-01-02" }},
      id: {{ trim .RelPermalink "/" | replaceRE "/" "-" }}
    },
    {{ end }}
  ];

  const container = document.getElementById("popular-posts-container");

  try {
    const res = await fetch("/like?id=all");
    if (!res.ok) throw new Error("Failed to fetch likes");
    const likesMap = await res.json();

    const rankedPosts = posts
      .map(post => ({
        ...post,
        likes: likesMap[post.id] || 0
      }))
      .filter(post => post.likes > 0)
      .sort((a, b) => {
        if (b.likes !== a.likes) return b.likes - a.likes;
        return b.date.localeCompare(a.date);
      })
      .slice(0, 5);

    if (rankedPosts.length === 0) {
      container.innerHTML = `<p style="opacity: 0.8; font-size: 0.9em;">まだいいねされた記事はありません。</p>`;
      return;
    }

    container.innerHTML = "";
    rankedPosts.forEach(post => {
      const div = document.createElement("div");
      div.style.marginBottom = "0.5em";
      div.innerHTML = `
        <span style="opacity: 0.8; font-size: 0.9em; margin-right: 0.5em;">${post.date}：</span>
        <a href="${post.url}" style="font-weight: 500;">${post.title}</a>
        <span style="opacity: 0.8; font-size: 0.9em; margin-left: 0.5em;">♥ ${post.likes}</span>
      `;
      container.appendChild(div);
    });

  } catch (e) {
    console.error(e);
    container.innerHTML = `<p style="opacity: 0.8; font-size: 0.9em;">記事を読み込めませんでした。</p>`;
  }
});
</script>
