{{ $id := .Get "id" | default .Page.File.TranslationBaseName }}

<div style="margin: 1.5em 0;">
  <button id="like-btn-{{ $id }}" onclick="addLike('{{ $id }}')" style="padding: 6px 16px; border: 1px solid #ccc; border-radius: 20px; background: #fff; cursor: pointer; font-size: 0.9em; display: inline-flex; align-items: center; gap: 6px;">
    ❤️ いいね <span id="like-count-{{ $id }}">0</span>
  </button>
</div>

<script>
(function() {
  const id = "{{ $id }}";
  fetch(`https://api.lyket.dev/v1/like-buttons/manakitazawa-blog/${id}`)
    .then(res => res.json())
    .then(data => {
      if (data.data && data.data.attributes) {
        document.getElementById(`like-count-${id}`).innerText = data.data.attributes.total_likes;
      }
    })
    .catch(err => console.error(err));
})();

function addLike(id) {
  fetch(`https://api.lyket.dev/v1/like-buttons/manakitazawa-blog/${id}/press-like`, {
    method: 'PUT'
  })
    .then(res => res.json())
    .then(data => {
      if (data.data && data.data.attributes) {
        document.getElementById(`like-count-${id}`).innerText = data.data.attributes.total_likes;
      }
    })
    .catch(err => console.error(err));
}
</script>
