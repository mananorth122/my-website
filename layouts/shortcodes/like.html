{{ $id := .Get "id" | default .Page.File.TranslationBaseName }}

<div style="margin: 1.5em 0;">
  <button id="like-btn-{{ $id }}" onclick="addLike('{{ $id }}')" style="padding: 6px 16px; border: 1px solid #ccc; border-radius: 20px; background: #fff; cursor: pointer; font-size: 0.9em; display: inline-flex; align-items: center; gap: 6px;">
    ❤️ いいね <span id="like-count-{{ $id }}">0</span>
  </button>
</div>

<script>
(function() {
  const id = "{{ $id }}";
  fetch(`/like?id=${id}`)
    .then(res => res.json())
    .then(data => {
      if (data.count !== undefined) {
        document.getElementById(`like-count-${id}`).innerText = data.count;
      }
    })
    .catch(err => console.error(err));
})();

function addLike(id) {
  fetch(`/like?id=${id}`, { method: 'POST' })
    .then(res => res.json())
    .then(data => {
      if (data.count !== undefined) {
        document.getElementById(`like-count-${id}`).innerText = data.count;
      }
    })
    .catch(err => console.error(err));
}
</script>
