{{ $id := .Get "id" | default .Page.File.TranslationBaseName }}

<div style="margin: 1.5em 0;">
  <button id="like-btn-{{ $id }}" onclick="addLike('{{ $id }}')" style="padding: 6px 12px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer;">
    ❤️ いいね <span id="like-count-{{ $id }}">0</span>
  </button>
</div>

<script>
(function() {
  const id = "{{ $id }}";
  // カウントを取得して表示
  fetch(`https://api.counterapi.dev/v1/manakitazawa_website/${id}/`)
    .then(res => res.json())
    .then(data => {
      if (data.count !== undefined) {
        document.getElementById(`like-count-${id}`).innerText = data.count;
      }
    })
    .catch(() => {});
})();

function addLike(id) {
  // いいねを加算
  fetch(`https://api.counterapi.dev/v1/manakitazawa_website/${id}/up`)
    .then(res => res.json())
    .then(data => {
      if (data.count !== undefined) {
        document.getElementById(`like-count-${id}`).innerText = data.count;
      }
    })
    .catch(() => {});
}
</script>
