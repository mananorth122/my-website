{{/* ファイル名（book39など）から数字だけを抽出 */}}
{{ if .File }}
  {{ $fileName := .File.TranslationBaseName }}
  {{ if strings.HasPrefix $fileName "book" }}
    {{ $num := replaceRE `[^0-9]` "" $fileName }}
    {{ if $num }}
      <span class="book-badge">Vol.{{ printf "%02d" (int $num) }}</span>
    {{ end }}
  {{ end }}
{{ end }}
