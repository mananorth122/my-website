<header class="entry-header">
  <h2 class="entry-hint-parent">
    {{/* ↓ ここから追加 */}}
    {{ $num := "" }}
    {{ if .File }}
      {{ $num = replaceRE `[^0-9]` "" .File.TranslationBaseName }}
    {{ end }}
    {{ if not $num }}
      {{ $num = replaceRE `[^0-9]` "" .RelPermalink }}
    {{ end }}

    {{ if $num }}
      <span class="book-badge">Vol.{{ printf "%02d" (int $num) }}</span>
    {{ end }}
    {{/* ↑ ここまで追加 */}}

    {{- .Title -}}
  </h2>
</header>
