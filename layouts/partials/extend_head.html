<!-- Book Log 自動バッジ生成スクリプト -->
<script>
function renderBookBadges() {
  const allLinks = document.querySelectorAll('a[href*="book"]');
  
  allLinks.forEach(link => {
    const href = link.getAttribute('href');
    const match = href.match(/book[-_]?([0-9]+)/i);
    
    if (match && match[1]) {
      const num = match[1].padStart(2, '0');
      
      if (!link.querySelector('.book-badge')) {
        const badge = document.createElement('span');
        badge.className = 'book-badge';
        badge.textContent = `Vol.${num}`;
        
        // タイトル要素（h2など）の中に直接バッジを挿入する
        const titleTarget = link.querySelector('h2, .post-title, .entry-title');
        if (titleTarget) {
          titleTarget.insertBefore(badge, titleTarget.firstChild);
        } else {
          link.insertBefore(badge, link.firstChild);
        }
      }
    }
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', renderBookBadges);
} else {
  renderBookBadges();
}
</script>
