<!-- Book Log 自動バッジ生成スクリプト（レイアウト分離版） -->
<script>
function renderBookBadges() {
  const allLinks = document.querySelectorAll('a[href*="book"]');
  
  allLinks.forEach(link => {
    const href = link.getAttribute('href');
    const match = href.match(/book[-_]?([0-9]+)/i);
    
    if (match && match[1]) {
      const num = match[1].padStart(2, '0');
      
      if (!link.querySelector('.book-badge')) {
        const badge = document.createElement('span');
        badge.className = 'book-badge';
        badge.textContent = `Vol.${num}`;
        
        // h2 または .entry-header の一番先頭に配置
        const header = link.querySelector('.entry-header') || link.querySelector('h2') || link;
        header.insertBefore(badge, header.firstChild);
      }
    }
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', renderBookBadges);
} else {
  renderBookBadges();
}
</script>
